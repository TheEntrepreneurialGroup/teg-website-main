<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/shared/brand/teg-favicon.avif" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>TEG - The Entrepreneurial Group</title>
  </head>
  <body>
    <!--
      Brief boot placeholder only. React replaces #root on mount.
      Diagnostic text appears only if JS has not mounted after ~2.5s
      (real load failure) — not on normal Cloudflare/iOS boots.
    -->
    <div id="root">
      <p
        id="boot-fallback"
        style="
          margin: 0;
          padding: 24px 20px;
          font-family: system-ui, -apple-system, sans-serif;
          font-size: 15px;
          line-height: 1.4;
          color: #333;
          background: #0a1c1a;
          color: #e8f0ee;
          min-height: 100vh;
          min-height: 100dvh;
          box-sizing: border-box;
        "
      >
        TEG lädt…
      </p>
    </div>
    <script>
      // Only show troubleshooting if the app never mounts (stuck boot).
      window.setTimeout(function () {
        var el = document.getElementById("boot-fallback");
        if (!el || !el.isConnected) return;
        el.innerHTML =
          "TEG lädt…<br><span style=\"font-size:13px;color:#a8c0b8\">" +
          "Dauert länger als erwartet. Prüfe Dev-Server / Tunnel, oder iOS " +
          "„Lokales Netzwerk“ für den Browser (nur bei LAN-IP nötig)." +
          "</span>";
      }, 2500);
    </script>
    <script prerender type="module" src="/src/bootstrap.tsx"></script>
  </body>
</html>
